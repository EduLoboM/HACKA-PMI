<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0f172a" />
		<title>KrillShield · Offline</title>
		<style>
			body {
				margin: 0;
				background: #0f172a;
				color: #e2e8f0;
				font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
				display: flex;
				align-items: center;
				justify-content: center;
				min-height: 100vh;
				text-align: center;
			}
			.wrap {
				padding: 32px;
				max-width: 340px;
			}
			h1 {
				font-size: 20px;
				margin: 0 0 8px;
			}
			p {
				color: #94a3b8;
				font-size: 14px;
				line-height: 1.5;
				margin: 0 0 20px;
			}
			button {
				background: linear-gradient(90deg, #f97316, #e11d48);
				color: #fff;
				border: 0;
				border-radius: 12px;
				padding: 12px 22px;
				font-size: 14px;
				font-weight: 700;
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<div class="wrap">
			<h1>Sem conexão</h1>
			<p>O KrillShield está offline agora. Reconecte para continuar avaliando o crédito no agro.</p>
			<button onclick="location.reload()">Tentar novamente</button>
		</div>
	</body>
</html>
